<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rastreamento em Tempo Real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{
  --bg-deep:#0a0f1c;
  --paper:#fbfaf8;
  --ink:#12141c;
  --muted:#6b7280;
  --line:#e8e6e0;
  --heat:#ff5722;
  --heat-dark:#e6491b;
  --cool:#0ea5e9;
  --ok:#16a34a;
  --warn:#dc2626;
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Inter',sans-serif;
  background:
    radial-gradient(1100px 600px at 15% -10%, #16233d 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 110%, #1a1330 0%, transparent 55%),
    var(--bg-deep);
  padding:20px;
  min-height:100vh;
}
.container{max-width:1440px;margin:auto;position:relative;}
#map{
  height:88vh;
  border-radius:24px;
  box-shadow:0 30px 60px rgba(2,6,23,.55), 0 0 0 1px rgba(255,255,255,.05);
}

/* ---------- floating panels ---------- */
.panel{
  position:absolute;
  z-index:999;
  width:296px;
  background:rgba(251,250,248,.94);
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  border:1px solid rgba(17,20,28,.06);
  border-radius:var(--radius);
  box-shadow:0 24px 48px rgba(2,6,23,.4), 0 2px 6px rgba(2,6,23,.15);
  padding:20px 20px 18px;
  color:var(--ink);
}
.sidebar{top:20px;left:20px;}
.audit-panel{top:20px;right:20px;max-height:88vh;overflow:auto;}

.panel-eyebrow{
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.11em;
  text-transform:uppercase;
  color:var(--heat-dark);
}
.panel-title{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:18px;
  font-weight:800;
  letter-spacing:-.01em;
  margin-top:2px;
  margin-bottom:14px;
}
.panel-title .glyph{
  width:30px;height:30px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
}
.sidebar .glyph{background:linear-gradient(145deg,var(--heat),var(--heat-dark));color:#fff;box-shadow:0 6px 14px rgba(255,87,34,.35);}
.audit-panel .glyph{background:linear-gradient(145deg,#1e293b,#0f172a);color:#fff;box-shadow:0 6px 14px rgba(15,23,42,.3);}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 0;
  border-top:1px solid var(--line);
}
.row:first-of-type{border-top:none;padding-top:0;}
.row-label{
  font-size:11px;
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--muted);
}
.row-value{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  font-weight:600;
  color:var(--ink);
  text-align:right;
}
.route-value{display:flex;align-items:center;gap:7px;}
.route-dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(0,0,0,.04);}

.status-pill{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;}
.status-pill.is-online .status-dot{background:var(--ok);box-shadow:0 0 0 4px rgba(22,163,74,.15);}
.status-pill.is-online{color:var(--ok);}
.status-pill.is-offline .status-dot{background:var(--warn);}
.status-pill.is-offline{color:var(--warn);}
.status-pill.is-connecting .status-dot{background:#d97706;animation:blink 1.1s ease-in-out infinite;}
.status-pill.is-connecting{color:#b45309;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- audit list ---------- */
.audit-count-badge{
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:13px;
  background:#f1f0eb;
  padding:3px 10px;
  border-radius:20px;
}
.audit-list{list-style:none;margin-top:6px;}
.audit-list li{
  padding:12px 2px;
  border-top:1px solid var(--line);
  display:flex;
  flex-direction:column;
  gap:3px;
}
.audit-list li:first-child{border-top:none;}
.audit-row-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.audit-order{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;}
.audit-order .route-dot{width:8px;height:8px;}
.audit-duration{
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:12.5px;
  color:#fff;
  background:linear-gradient(145deg,var(--cool),#0369a1);
  padding:3px 9px;
  border-radius:8px;
  white-space:nowrap;
}
.audit-meta{color:var(--muted);font-size:11.5px;font-family:'JetBrains Mono',monospace;}
.audit-empty{color:var(--muted);font-size:13px;margin-top:10px;text-align:center;padding:18px 0;border:1px dashed var(--line);border-radius:12px;}

/* ---------- courier marker ---------- */
.delivery-marker{position:relative;width:54px;height:54px;display:flex;align-items:center;justify-content:center;}
.pulse-ring{
  position:absolute;width:54px;height:54px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,87,34,.55) 0%, rgba(255,87,34,0) 70%);
  animation:radar 2.4s ease-out infinite;
}
.pulse-ring.delay{animation-delay:1.2s;}
@keyframes radar{0%{transform:scale(.35);opacity:.55}100%{transform:scale(1.7);opacity:0}}
.delivery-avatar{
  position:relative;width:38px;height:38px;border-radius:50%;
  background:linear-gradient(150deg,var(--heat) 0%,var(--heat-dark) 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 18px rgba(255,87,34,.5), 0 0 0 3px #fff;
  transition:transform .25s ease;
}
.delivery-avatar svg{width:22px;height:22px;}

@media (max-width:760px){
  #map{height:60vh;}
  .panel{position:static;width:100%;margin-bottom:14px;max-height:none;}
  .container{display:flex;flex-direction:column;}
}
</style>
</head>
<body>
<div class="container">

  <div class="panel sidebar">
    <div class="panel-eyebrow">Operação ao vivo</div>
    <div class="panel-title"><span class="glyph">📍</span>Rastreamento</div>

    <div class="row">
      <span class="row-label">Status</span>
      <span id="status" class="status-pill is-connecting"><span class="status-dot"></span>Conectando…</span>
    </div>
    <div class="row">
      <span class="row-label">Rota</span>
      <span class="row-value route-value"><span id="route-dot" class="route-dot" style="background:#ff5722"></span><span id="route">#1</span></span>
    </div>
    <div class="row">
      <span class="row-label">Atualização</span>
      <span id="time" class="row-value">--</span>
    </div>
    <div class="row">
      <span class="row-label">Coordenadas</span>
      <span id="coords" class="row-value">--</span>
    </div>
    <div class="row">
      <span class="row-label">Distância restante</span>
      <span id="distance" class="row-value">--</span>
    </div>
  </div>

  <div class="panel audit-panel">
    <div class="panel-eyebrow">Conformidade</div>
    <div class="panel-title"><span class="glyph">📋</span>Auditoria</div>

    <div class="row">
      <span class="row-label">Serviço</span>
      <span id="audit-status" class="status-pill is-connecting"><span class="status-dot"></span>Carregando…</span>
    </div>
    <div class="row">
      <span class="row-label">Entregas registradas</span>
      <span id="audit-count" class="audit-count-badge">0</span>
    </div>

    <ul id="audit-list" class="audit-list"></ul>
    <p id="audit-empty" class="audit-empty">Nenhuma entrega registrada ainda.</p>
  </div>

  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const colors=["#ff5722","#2563eb","#16a34a","#7c3aed","#dc2626","#0891b2","#ca8a04"];
let idx=0,currentPolyline,lastOrderId=null,marker=null;

const orderColors=new Map();
function hashColor(str){
  let h=0;
  for(let i=0;i<str.length;i++) h=str.charCodeAt(i)+((h<<5)-h);
  return colors[Math.abs(h)%colors.length];
}
function colorForOrder(orderId){
  if(!orderId) return colors[0];
  if(!orderColors.has(orderId)) orderColors.set(orderId,hashColor(orderId));
  return orderColors.get(orderId);
}

const map=L.map("map",{zoomControl:true}).setView([-21.7545,-41.3245],15);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap &copy; CARTO"}).addTo(map);

const icon=L.divIcon({
  className:"delivery-icon",
  html:`<div class="delivery-marker">
          <span class="pulse-ring"></span>
          <span class="pulse-ring delay"></span>
          <div class="delivery-avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="5.5" cy="17.5" r="2.4"/>
              <circle cx="18" cy="17.5" r="2.4"/>
              <path d="M5.5 17.5H2.3l1-4.2h3.6l2-3.6h3.8l1.6 3.1h2.3a2 2 0 0 1 2 2v2.7h-2.1"/>
              <path d="M8.6 9.7h3"/>
              <path d="M13.8 6.6l2.1 3.1"/>
            </svg>
          </div>
        </div>`,
  iconSize:[54,54],
  iconAnchor:[27,27]
});

function setRouteColor(color){
  document.getElementById("route-dot").style.background=color;
}

function newRoute(label){
  if(currentPolyline) currentPolyline.setStyle({opacity:.22,weight:4});
  const color=label?colorForOrder(label):colors[idx%colors.length];
  currentPolyline=L.polyline([],{color,weight:5,opacity:.95,lineCap:"round",dashArray:"1 10",className:"route-flow"}).addTo(map);
  idx++;
  document.getElementById("route").textContent=label||("#"+idx);
  setRouteColor(color);
}
newRoute();

function setConnectionState(el,state,labelConnecting,labelOnline,labelOffline){
  el.classList.remove("is-online","is-offline","is-connecting");
  if(state==="online"){el.classList.add("is-online");el.innerHTML=`<span class="status-dot"></span>${labelOnline}`;}
  else if(state==="offline"){el.classList.add("is-offline");el.innerHTML=`<span class="status-dot"></span>${labelOffline}`;}
  else{el.classList.add("is-connecting");el.innerHTML=`<span class="status-dot"></span>${labelConnecting}`;}
}

const statusEl=document.getElementById("status");
const es=new EventSource("/stream");
es.onopen=()=>setConnectionState(statusEl,"online","Conectando…","Online","Desconectado");
es.onerror=()=>setConnectionState(statusEl,"offline","Conectando…","Online","Desconectado");
es.addEventListener("carMoved",e=>{
  const data=JSON.parse(e.data);
  const payload=typeof data.payload==="string"?JSON.parse(data.payload):(data.payload||data);
  if(payload.orderId){
    if(lastOrderId && payload.orderId!==lastOrderId) newRoute(payload.orderId);
    else if(!lastOrderId){
      document.getElementById("route").textContent=payload.orderId;
      setRouteColor(colorForOrder(payload.orderId));
    }
    lastOrderId=payload.orderId;
  }
  const p=payload.position||payload;
  const pos=[p.lat,p.lng];
  currentPolyline.addLatLng(pos);
  if(!marker){marker=L.marker(pos,{icon}).addTo(map);map.setView(pos,16);}
  else{marker.setLatLng(pos);map.panTo(pos,{animate:true,duration:1});}
  document.getElementById("coords").textContent=`${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`;
  document.getElementById("distance").textContent=Number.isFinite(payload.remainingDistanceKm)?payload.remainingDistanceKm.toFixed(2)+" km":"--";
  document.getElementById("time").textContent=new Date().toLocaleTimeString();
});

function formatDuration(ms){
  if(!Number.isFinite(ms)||ms<0) return "--";
  const totalSeconds=Math.floor(ms/1000);
  const minutes=Math.floor(totalSeconds/60);
  const seconds=totalSeconds%60;
  return minutes>0?`${minutes}m ${seconds}s`:`${seconds}s`;
}
function formatTime(iso){
  const date=new Date(iso);
  return Number.isNaN(date.getTime())?"--":date.toLocaleTimeString();
}
function renderAuditDeliveries(deliveries){
  const list=document.getElementById("audit-list");
  const empty=document.getElementById("audit-empty");
  document.getElementById("audit-count").textContent=String(deliveries.length);
  list.innerHTML="";
  if(!deliveries.length){
    empty.style.display="block";
    return;
  }
  empty.style.display="none";
  for(const delivery of deliveries){
    const item=document.createElement("li");
    const dotColor=colorForOrder(delivery.orderId);
    item.innerHTML=`
      <div class="audit-row-top">
        <span class="audit-order"><span class="route-dot" style="background:${dotColor}"></span>${delivery.orderId}</span>
        <span class="audit-duration">${formatDuration(delivery.durationMs)}</span>
      </div>
      <div class="audit-meta">${delivery.routeName||"Rota"} · ${formatTime(delivery.occurredAt)}</div>`;
    list.appendChild(item);
  }
}
const auditDeliveries=new Map();
function upsertAuditDelivery(delivery){
  auditDeliveries.set(delivery.orderId,delivery);
  renderAuditDeliveries([...auditDeliveries.values()].sort((a,b)=>new Date(b.occurredAt)-new Date(a.occurredAt)));
}
const auditStatusEl=document.getElementById("audit-status");
const auditEs=new EventSource("/audit/stream");
auditEs.onopen=()=>setConnectionState(auditStatusEl,"online","Carregando…","Online","Desconectado");
auditEs.onerror=()=>setConnectionState(auditStatusEl,"offline","Carregando…","Online","Desconectado");
auditEs.addEventListener("deliveryRecorded",e=>{
  upsertAuditDelivery(JSON.parse(e.data));
});
</script>
</body>
</html>
