<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rastreamento em Tempo Real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:linear-gradient(135deg,#eef2ff,#dbeafe,#f8fafc);padding:20px}
.container{max-width:1400px;margin:auto;position:relative}
#map{height:88vh;border-radius:18px}
.sidebar{position:absolute;top:20px;left:20px;z-index:999;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);padding:18px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.15);width:280px}
.audit-panel{position:absolute;top:20px;right:20px;z-index:999;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);padding:18px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.15);width:320px;max-height:88vh;overflow:auto}
.item{margin-top:12px}
.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#e5e7eb}
.badge.ok{background:#dcfce7;color:#166534}
.audit-list{list-style:none;margin-top:10px}
.audit-list li{padding:10px 0;border-bottom:1px solid #e5e7eb;font-size:13px;line-height:1.45}
.audit-list li:last-child{border-bottom:none}
.audit-empty{color:#64748b;font-size:13px;margin-top:8px}
.audit-duration{font-weight:600;color:#2563eb}
.audit-meta{color:#64748b;font-size:12px;margin-top:4px}
.delivery-icon div{width:46px;height:46px;border-radius:50%;background:#ff5722;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;animation:pulse 1.5s infinite}
@keyframes pulse{0%{transform:scale(1)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div class="container">
<div class="sidebar">
<h2>🛵 Rastreamento</h2>
<div class="item">Status: <span id="status" class="badge">Conectando...</span></div>
<div class="item">Rota: <strong id="route">#1</strong></div>
<div class="item">Atualização: <strong id="time">--</strong></div>
<div class="item">Coordenadas:<br><span id="coords">--</span></div>
<div class="item">Distância: <strong id="distance">--</strong></div>
</div>
<div class="audit-panel">
<h2>📋 Auditoria</h2>
<div class="item">Serviço: <span id="audit-status" class="badge">Carregando...</span></div>
<div class="item">Entregas registradas: <strong id="audit-count">0</strong></div>
<ul id="audit-list" class="audit-list"></ul>
<p id="audit-empty" class="audit-empty">Nenhuma entrega registrada ainda.</p>
</div>
<div id="map"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const colors=["#ff5722","#2563eb","#16a34a","#7c3aed","#dc2626","#0891b2","#ca8a04"];
let idx=0,currentPolyline,lastOrderId=null,marker=null;
const map=L.map("map").setView([-21.7545,-41.3245],15);
L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{maxZoom:19}).addTo(map);
const icon=L.divIcon({className:"delivery-icon",html:"<div>🛵</div>",iconSize:[46,46],iconAnchor:[23,23]});
function newRoute(label){
 if(currentPolyline) currentPolyline.setStyle({opacity:.25,weight:4});
 currentPolyline=L.polyline([],{color:colors[idx%colors.length],weight:6}).addTo(map);
 idx++;
 document.getElementById("route").textContent=label||("#"+idx);
}
newRoute();
const es=new EventSource("/stream");
es.onopen=()=>document.getElementById("status").textContent="Online";
es.onerror=()=>document.getElementById("status").textContent="Desconectado";
es.addEventListener("carMoved",e=>{
 const data=JSON.parse(e.data);
 const payload=typeof data.payload==="string"?JSON.parse(data.payload):(data.payload||data);
 if(payload.orderId){
  if(lastOrderId && payload.orderId!==lastOrderId) newRoute(payload.orderId);
  else if(!lastOrderId) document.getElementById("route").textContent=payload.orderId;
  lastOrderId=payload.orderId;
 }
 const p=payload.position||payload;
 const pos=[p.lat,p.lng];
 currentPolyline.addLatLng(pos);
 if(!marker){marker=L.marker(pos,{icon}).addTo(map);map.setView(pos,16);}
 else{marker.setLatLng(pos);map.panTo(pos,{animate:true,duration:1});}
 document.getElementById("coords").textContent=`${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`;
 document.getElementById("distance").textContent=Number.isFinite(payload.remainingDistanceKm)?payload.remainingDistanceKm.toFixed(2)+" km":"--";
 document.getElementById("time").textContent=new Date().toLocaleTimeString();
});
function formatDuration(ms){
 if(!Number.isFinite(ms)||ms<0) return "--";
 const totalSeconds=Math.floor(ms/1000);
 const minutes=Math.floor(totalSeconds/60);
 const seconds=totalSeconds%60;
 return minutes>0?`${minutes}m ${seconds}s`:`${seconds}s`;
}
function formatTime(iso){
 const date=new Date(iso);
 return Number.isNaN(date.getTime())?"--":date.toLocaleTimeString();
}
function renderAuditDeliveries(deliveries){
 const list=document.getElementById("audit-list");
 const empty=document.getElementById("audit-empty");
 document.getElementById("audit-count").textContent=String(deliveries.length);
 list.innerHTML="";
 if(!deliveries.length){
  empty.style.display="block";
  return;
 }
 empty.style.display="none";
 for(const delivery of deliveries){
  const item=document.createElement("li");
  item.innerHTML=`<div><strong>${delivery.orderId}</strong></div><div class="audit-duration">${formatDuration(delivery.durationMs)}</div><div class="audit-meta">${delivery.routeName||"Rota"} · ${formatTime(delivery.occurredAt)}</div>`;
  list.appendChild(item);
 }
}
const auditDeliveries=new Map();
function upsertAuditDelivery(delivery){
 auditDeliveries.set(delivery.orderId,delivery);
 renderAuditDeliveries([...auditDeliveries.values()].sort((a,b)=>new Date(b.occurredAt)-new Date(a.occurredAt)));
}
const auditEs=new EventSource("/audit/stream");
auditEs.onopen=()=>{
 document.getElementById("audit-status").textContent="Online";
 document.getElementById("audit-status").className="badge ok";
};
auditEs.onerror=()=>{
 document.getElementById("audit-status").textContent="Desconectado";
 document.getElementById("audit-status").className="badge";
};
auditEs.addEventListener("deliveryRecorded",e=>{
 upsertAuditDelivery(JSON.parse(e.data));
});
</script>
</body>
</html>
