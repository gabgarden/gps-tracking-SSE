# Desenvolvimento local. Em produção use: docker compose -f docker-compose.prod.yml up -d --build
version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rede_sse

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rede_sse

  backend:
    image: node:20-alpine
    container_name: backend
    volumes:
      - .:/app
      - node_modules_root:/app/node_modules
    working_dir: /app
    command: sh -c "npm install && npm run dev -w @gps-tracking/backend"
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://redis:6379
      - CAR_MOVEMENTS_CHANNEL=car-movements
      - AUDIT_AMQP_URL=amqp://rabbitmq:5672
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rede_sse

  audit:
    image: node:20-alpine
    container_name: audit
    volumes:
      - .:/app
      - node_modules_root:/app/node_modules
    working_dir: /app
    command: sh -c "npm install && npm run dev -w @gps-tracking/audit"
    ports:
      - "8081:8081"
    environment:
      - AUDIT_AMQP_URL=amqp://rabbitmq:5672
      - AUDIT_HTTP_PORT=8081
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rede_sse

  publisher:
    image: node:20-alpine
    container_name: publisher
    volumes:
      - .:/app
      - node_modules_root:/app/node_modules
    working_dir: /app
    command: sh -c "npm install && npm run dev -w @gps-tracking/publisher"
    environment:
      - TELEMETRY_URL=http://backend:8080/telemetry
      - ORDER_STATUS_BASE_URL=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rede_sse

  frontend:
    image: nginx:alpine
    container_name: frontend
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
      audit:
        condition: service_started
    networks:
      - rede_sse

volumes:
  node_modules_root:

networks:
  rede_sse:
    driver: bridge
